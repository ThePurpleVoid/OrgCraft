name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh templates/*.sh tests/*.sh examples/*/.agent-team/config.sh .agent-team/config.sh
      - name: Briefs (the kit's role library)
        run: node tools/roster.mjs --check team/roles
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Script and installer tests
        run: bash tests/scripts.test.sh
      - name: This repository's own team is in sync with its pinned kit release
        run: scripts/agent-team/sync.sh check

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: owner, POSTGRES_PASSWORD: owner, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --prefix apps/server
      - name: Control plane on PGlite
        run: npm test --prefix apps/server
      - name: Control plane on Postgres, as a schema owner that is not a superuser
        env: { PGPASSWORD: owner }
        run: |
          psql -h localhost -U owner -d postgres -c "create role kit login createrole password 'kit'" -c "create database kit owner kit"
          TEST_DATABASE_URL=postgres://kit:kit@localhost:5432/kit npm test --prefix apps/server

  runner:
    # apps/runner's own tests. Never real model calls: no ANTHROPIC_API_KEY and no RUNNER_SMOKE here. The steps skip
    # until apps/runner exists on the branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Runner tests
        if: hashFiles('apps/runner/package.json') != ''
        run: npm ci --prefix apps/runner && npm test --prefix apps/runner

  runner-image:
    # The runner's container, built as shipped, with the sandbox tests run inside it as the runner user (the
    # real-key gate, security review F3). No secrets: the "key" in the environment is a marker the tests look for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runner image
        if: hashFiles('apps/runner/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner/Dockerfile
          tags: agent-team-runner:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sandbox tests inside the image
        if: hashFiles('apps/runner/Dockerfile') != ''
        run: |
          docker run --rm -e RUNNER_F3_MARKER=sk-ant-ci-marker-not-a-key-0123456789 \
            agent-team-runner:ci node --test apps/runner/test/security.test.mjs | tee runner-image.tap
          # Every test must have run in the image: a skip here means the sandbox was not exercised.
          grep -q '^# fail 0$' runner-image.tap && grep -q '^# skipped 0$' runner-image.tap
      - name: Keys from the M3-on-a-Mac mount land in the runner's closed folder
        if: hashFiles('apps/runner/Dockerfile') != ''
        run: |
          # A throwaway key pair made here; nothing secret. The one-off container installs them, as in the README.
          mkdir -p "$RUNNER_TEMP/secrets"
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/secrets/runner-deploy-key"
          echo not-a-key > "$RUNNER_TEMP/secrets/merger-app.pem"
          chmod 0644 "$RUNNER_TEMP/secrets/"*
          docker volume create runner-keys-ci
          docker run --rm -v "$RUNNER_TEMP/secrets:/run/agent-team:ro" -v runner-keys-ci:/data agent-team-runner:ci true
          docker run --rm -v runner-keys-ci:/data agent-team-runner:ci \
            stat -c '%U %a %n' /data/runner/deploy-key /data/runner/merger-app.pem /data/runner/gitconfig | tee keys.txt
          test "$(grep -c '^runner 600 ' keys.txt)" = 3
          docker run --rm -v runner-keys-ci:/data agent-team-runner:ci \
            sh -c 'GIT_CONFIG_GLOBAL=/data/runner/gitconfig git config --global core.sshCommand' | grep -q 'StrictHostKeyChecking=yes'
          # A session's user cannot read the copied key.
          if docker run --rm -v runner-keys-ci:/data agent-team-runner:ci \
            /usr/local/libexec/agent-team/setpriv --reuid=10002 --regid=10010 --clear-groups cat /data/runner/deploy-key; then
            echo "the agent user read the deploy key"; exit 1
          fi

  deploy-path:
    # The hosted deploy path on a Postgres shaped like Supabase (anon and authenticated roles with default grants on
    # public, a CREATEROLE owner that is not a superuser), behind pgbouncer in transaction mode. A cluster of its own:
    # agent_team_app is a cluster-wide role, created here by the bootstrap's login.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: owner, POSTGRES_PASSWORD: owner, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci --prefix apps/server
          sudo apt-get install -y -q pgbouncer >/dev/null
      - name: A Supabase-shaped database, and the bootstrap
        env: { PGPASSWORD: owner }
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U owner -d postgres \
            -c "create role anon nologin" -c "create role authenticated nologin" \
            -c "create role sb login createrole password 'sb'" -c "alter database postgres owner to sb" \
            -c "alter schema public owner to sb" -c "grant usage on schema public to anon, authenticated" \
            -c "alter default privileges for role sb in schema public grant all on tables to anon, authenticated"
          sed "s/REPLACE_WITH_A_GENERATED_PASSWORD/ci-only/" deploy/supabase/bootstrap.sql > "$RUNNER_TEMP/bootstrap.sql"
          PGPASSWORD=sb psql -v ON_ERROR_STOP=1 -h localhost -U sb -d postgres -f "$RUNNER_TEMP/bootstrap.sql"
          PGPASSWORD=sb psql -v ON_ERROR_STOP=1 -h localhost -U sb -d postgres -f "$RUNNER_TEMP/bootstrap.sql"
      - name: Migrate refuses the exposed public schema
        run: |
          if DATABASE_URL=postgres://sb:sb@localhost:5432/postgres node deploy/server/migrate.mjs; then echo "should have refused"; exit 1; fi
      - name: Migrate as agent_team_owner, twice
        env: { DATABASE_URL: "postgres://agent_team_owner:ci-only@localhost:5432/postgres" }
        run: node deploy/server/migrate.mjs && node deploy/server/migrate.mjs
      - name: The server through a transaction pooler, and the smoke test
        run: |
          d="$RUNNER_TEMP/pgb"; mkdir -p "$d"
          printf '[databases]\n* = host=127.0.0.1 port=5432\n[pgbouncer]\nlisten_addr = 127.0.0.1\nlisten_port = 6543\nauth_type = plain\nauth_file = %s/users.txt\npool_mode = transaction\ndefault_pool_size = 3\npidfile = %s/pgbouncer.pid\nlogfile = %s/pgbouncer.log\n' "$d" "$d" "$d" > "$d/pgbouncer.ini"
          printf '"agent_team_owner" "ci-only"\n' > "$d/users.txt"
          pgbouncer -d "$d/pgbouncer.ini"
          export AGENT_TEAM_ADMIN_TOKEN=adm_ci_only AGENT_TEAM_MASTER_KEY="$(openssl rand -base64 32)"
          DATABASE_URL=postgres://agent_team_owner:ci-only@127.0.0.1:6543/postgres DATABASE_POOL=3 PORT=4849 node apps/server/bin.mjs &
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors localhost:4849/v1/health
          curl -fsS -H "authorization: Bearer $AGENT_TEAM_ADMIN_TOKEN" -H 'content-type: application/json' -d '{"id":"ci"}' localhost:4849/v1/teams
          node deploy/smoke.mjs --site http://127.0.0.1:4849 --api http://127.0.0.1:4849 --api-only --wait 25
      - name: The Vercel site builds
        run: node deploy/vercel/build.mjs --api https://example.invalid --out "$RUNNER_TEMP/site" && test -f "$RUNNER_TEMP/site/vercel.json"

  studio-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium (test only; the Studio itself has no dependencies)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: The control plane's dependencies (the browser test also runs against the real apps/server)
        run: npm ci --prefix apps/server
      - name: Studio in a browser (chat round trip, stale card, 360px, start a run, the real control plane)
        env: { SCREENSHOTS: screenshots }
        run: node --test tests/e2e/*.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: studio-screenshots, path: screenshots, if-no-files-found: ignore }
