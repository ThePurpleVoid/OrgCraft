openapi: 3.1.0
info:
  title: Agent Team Studio API
  version: "1"
  summary: The public API. The Studio, the CLI, the kit's hooks and integrations use only this.
  description: |
    Versioned in the path. Within /v1/, changes are additive only, and a removal comes with at least 12 months'
    notice (docs/contracts/README.md). Every response that lists things pages with `cursor` and `limit`.
    Every write accepts an `Idempotency-Key` header (1 to 255 characters, scoped to the caller). The first answer,
    errors included, is kept for 24 hours; a retry with the same key and the same method, path and body gets it back
    with `Idempotent-Replayed: true`. The same key on a different request is `422`; while the first request is still
    running, a retry gets `409`. Server errors (5xx) are not kept, so a retry runs again.

    Authentication:
    - People sign in through OIDC (GitHub first) and send a session cookie or a bearer token.
    - Agent sessions use a short-lived session token from the runner.
    - Teams that report from outside the product (the kit's scripts and hooks) use a per-team **report token**
      in `x-team-token`. It can append reports for that one team and read nothing.
servers:
  - url: https://{host}/v1
    variables: { host: { default: localhost:4849 } }
security:
  - person: []
  - cookie: []
tags:
  - { name: teams }
  - { name: events, description: "The event log (events.md) and the board projected from it" }
  - { name: runs }
  - { name: chat }
  - { name: approvals }
  - { name: connectors }
  - { name: notifications, description: "Email a person when something needs them (PRD 6.8): their own verified addresses, the kinds they chose, signed links" }
  - { name: runners, description: Registration. The runner protocol itself is runner-protocol.md }
  - { name: me, description: "The signed-in person across teams: inbox, summary, devices (clients.md)" }
paths:
  /teams:
    get: { x-min-role: viewer, tags: [teams], summary: Teams in the workspaces I can see, responses: { "200": { $ref: "#/components/responses/TeamList" } } }
    post:
      x-min-role: admin
      tags: [teams]
      summary: Connect a team (a repository with .agent-team/, or a new Studio-managed team repository)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TeamCreate" } } } }
      responses: { "201": { $ref: "#/components/responses/Team" } }
  /teams/{team}:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [teams]
      summary: The team, its live version (commit SHA), and its spec at that version as a TeamSpec
      responses: { "200": { $ref: "#/components/responses/Team" } }
  /teams/{team}/preview:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: editor
      tags: [teams]
      summary: Every file a publish of this spec would change, and the validate issues
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SpecBody" } } } }
      responses: { "200": { description: Changes and issues, content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } } }
  /teams/{team}/publish:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: admin
      tags: [teams]
      summary: Compile, sync with the pinned kit, and propose (a pull request) or commit
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Publish" } } } }
      responses:
        "202": { description: Publish started; follow `team.published` events, content: { application/json: { schema: { $ref: "#/components/schemas/PublishResult" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /teams/{team}/reports:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      tags: [events]
      summary: Accept one report in the kit's shape (team-status.sh, report.mjs, the hooks), byte for byte
      description: Mapped to a `report.*` or `message.*` event (events.md). This is what TEAM_REPORT_URL points at.
      security: [ { reportToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KitReport" } } } }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { type: object, properties: { ok: { const: true }, id: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { description: More than 30 reports a minute from one role }
  /teams/{team}/events:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [events]
      summary: The event log, newest last, filtered by type prefix, actor and time
      parameters:
        - { name: type, in: query, schema: { type: string }, description: "Prefix, such as report. or approval." }
        - { name: actor, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses: { "200": { description: Events, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "schema/event.v1.json" } }, next: { type: string } } } } } } }
    post:
      x-min-role: admin
      tags: [events]
      summary: Append envelopes (runners and integrations). Ids make retries safe
      security: [ { session: [] }, { runner: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "schema/event.v1.json" }, maxItems: 500 } } } } } }
      responses: { "200": { description: Stored (duplicates ignored) } }
  /teams/{team}/events/stream:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [events]
      summary: Live events as server-sent events; resumes from Last-Event-ID
      responses: { "200": { description: text/event-stream of envelopes, content: { text/event-stream: {} } } }
  /teams/{team}/board:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [events]
      summary: Where every role stands now (the board projection)
      responses: { "200": { description: Board, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } } }
  /teams/{team}/report-tokens:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: admin
      tags: [events]
      summary: Mint a report token for TEAM_REPORT_TOKEN (shown once; append-only for this team)
      responses: { "201": { description: The token, content: { application/json: { schema: { type: object, properties: { id: { type: string }, token: { type: string }, url: { type: string } } } } } } }
  /teams/{team}/report-tokens/{token}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: token, in: path, required: true, schema: { type: string } } ]
    delete: { x-min-role: admin, tags: [events], summary: Revoke a report token, responses: { "200": { description: Revoked } } }
  /teams/{team}/sinks:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get: { x-min-role: admin, tags: [connectors], summary: Where this team's events are forwarded, responses: { "200": { description: Sinks } } }
    post:
      x-min-role: admin
      tags: [connectors]
      summary: Forward events to a URL, in order, at least once (kit-report keeps a board the team already runs working), or send them as email to opted-in people
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: "https, or http to this machine (not for email)" }
                format: { enum: [kit-report, event, email], default: kit-report, description: "email sends notification events to the people who opted in (PRD 6.8)" }
                provider: { type: string, description: "email only: the provider id, such as resend" }
                sender: { type: string, description: "email only: the From address" }
                header: { type: string, description: "Header to send the secret in, such as x-team-token" }
                secret: { type: string, description: "Name of a stored secret (PUT /secrets/{name})" }
                from: { enum: [now, start], default: now }
      responses: { "201": { description: The sink } }
  /teams/{team}/sinks/{sink}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: sink, in: path, required: true, schema: { type: string } } ]
    delete: { x-min-role: admin, tags: [connectors], summary: Stop forwarding, responses: { "200": { description: Removed } } }
  /teams/{team}/emails:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get: { x-min-role: viewer, tags: [notifications], summary: "The caller's own email addresses for this team, and the kinds they can switch on", responses: { "200": { description: "{ kinds, emails }" } } }
    post:
      x-min-role: viewer
      tags: [notifications]
      summary: Add an address for yourself; a 6-digit code is emailed to it (expires in 15 minutes). Nothing else is sent until it is verified and kinds are on
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
      responses: { "201": { description: "{ id, email, verified, sent, reason? }" }, "429": { description: A code was sent less than a minute ago } }
  /teams/{team}/emails/{email}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: email, in: path, required: true, schema: { type: string } } ]
    patch:
      x-min-role: viewer
      tags: [notifications]
      summary: Choose the kinds to email (approval, budget80, budget100, blocked, minutes); the address must be verified
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kinds], properties: { kinds: { type: array, items: { enum: [approval, budget80, budget100, blocked, minutes] } } } } } } }
      responses: { "200": { description: The address }, "409": { description: Not verified yet } }
    delete: { x-min-role: viewer, tags: [notifications], summary: Remove the address, responses: { "200": { description: Removed } } }
  /teams/{team}/emails/{email}/verify:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: email, in: path, required: true, schema: { type: string } } ]
    post:
      x-min-role: viewer
      tags: [notifications]
      summary: Verify the address with the emailed code (5 tries)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: "^[0-9]{6}$" } } } } } }
      responses: { "200": { description: Verified }, "400": { description: Wrong code }, "410": { description: Expired or out of tries } }
  /email/{action}:
    parameters: [ { name: action, in: path, required: true, schema: { enum: [link, unsubscribe, resubscribe] } }, { name: t, in: query, required: true, schema: { type: string } } ]
    get: { tags: [notifications], security: [], summary: "No sign-in, the signed token is the proof. link: redirects into the Studio until it expires (approvals 24 hours, others 7 days). unsubscribe: shows a page asking to turn off one kind for one team (the button POSTs)", responses: { "200": { description: A page }, "302": { description: Into the Studio }, "410": { description: The link expired } } }
    post: { tags: [notifications], security: [], summary: "unsubscribe: turns off one kind for one team (also RFC 8058 one-click); resubscribe: Turn it back on", responses: { "200": { description: A page } } }
  /secrets:
    get: { x-min-role: admin, tags: [connectors], summary: Secret names and when they changed (never values), responses: { "200": { description: Names } } }
  /secrets/{name}:
    parameters: [ { name: name, in: path, required: true, schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" } } ]
    put:
      x-min-role: admin
      tags: [connectors]
      summary: Store a secret (write-only; sealed with the server's master key). Needs step-up
      parameters: [ { $ref: "#/components/parameters/stepUp" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: string } } } } } }
      responses: { "200": { description: Stored }, "401": { description: "Step-up required (problem type step-up-required)" } }
  /health:
    get: { tags: [teams], security: [], summary: The server is up, responses: { "200": { description: OK } } }
  /teams/{team}/runs:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get: { x-min-role: viewer, tags: [runs], summary: Runs, responses: { "200": { description: Runs } } }
    post:
      x-min-role: editor
      tags: [runs]
      summary: Start a run (mode, caps). The chief of staff starts first
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RunCreate" } } } }
      responses: { "201": { description: The run } }
  /runs/{run}/{action}:
    post:
      x-min-role: editor
      tags: [runs]
      summary: Pause, resume or stop a run
      parameters:
        - { name: run, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { enum: [pause, resume, stop] } }
        - { $ref: "#/components/parameters/stepUp" }
      description: Pause and stop never need step-up. Resuming a run paused with reason budget does
      responses: { "200": { description: Done }, "401": { description: "Step-up required (problem type step-up-required)" } }
  /teams/{team}/chat:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [chat]
      summary: The chat with the chief of staff (chat.*, decision.*, approval.*, card.updated, run.* and budget.* events), with the current cards, the run and today's cost (docs/product/m3-design.md section 5)
      parameters: [ { name: before, in: query, schema: { type: string }, description: An event id; pages backwards from it }, { $ref: "#/components/parameters/limit" } ]
      responses: { "200": { description: Messages, content: { application/json: { schema: { $ref: "#/components/schemas/ChatPage" } } } } }
    post:
      x-min-role: editor
      tags: [chat]
      summary: Say something to the chief of staff. Stored verbatim
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 20000 }, replyTo: { type: string }, clientId: { type: string, maxLength: 80, description: "Made by the client (a ULID). A repeat returns the first message with 200" } } } } } }
      responses: { "200": { description: The chat.message event already stored for this clientId }, "201": { description: The chat.message event } }
  /approvals/{approval}:
    post:
      x-min-role: approver
      tags: [approvals]
      summary: Approve or deny. Checks the person's role in the workspace and a recent sign-in (step-up, clients.md section 3)
      parameters: [ { name: approval, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/stepUp" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { enum: [approved, denied] }, note: { type: string }, version: { type: integer, description: "The card version seen. Optional in /v1/ for older clients; a stale one gets 409" } } } } } }
      responses: { "200": { description: The approval.decided event }, "401": { description: "Step-up required (problem type step-up-required)" }, "403": { $ref: "#/components/responses/Problem" }, "409": { description: The approval changed, content: { application/json: { schema: { $ref: "#/components/schemas/Card" } } } } }
  /connectors:
    get: { x-min-role: viewer, tags: [connectors], summary: Connector manifests this deployment offers (connectors.md), responses: { "200": { description: Manifests } } }
  /teams/{team}/resources:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: admin
      tags: [connectors]
      summary: Connect a resource (a connector instance). Secret values go to the vault and are never returned
      responses: { "201": { description: The resource, with secret names only } }
  /runners:
    post:
      tags: [runners]
      summary: Register a runner with a one-time code; returns its runner key once
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string }, capabilities: { type: object } } } } } }
      responses: { "201": { description: "Runner id and key (`<id>.<secret>`, shown once)" }, "401": { description: The code is unknown, used or expired } }
    get: { x-min-role: admin, tags: [runners], summary: "Registered runners: name, capabilities, version, last seen, revoked (never keys)", responses: { "200": { description: Runners } } }
  /runners/codes:
    post:
      x-min-role: admin
      tags: [runners]
      summary: Mint a one-time registration code (XXXX-XXXX-XXXX, case and separators ignored), valid for 15 minutes and one use. Needs step-up
      parameters: [ { $ref: "#/components/parameters/stepUp" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string, description: A label for the runner it is meant for } } } } } }
      responses: { "201": { description: "The code and when it expires", content: { application/json: { schema: { type: object, properties: { code: { type: string }, expires: { type: string, format: date-time } } } } } }, "401": { description: "Step-up required (problem type step-up-required)" } }
  /runners/{runner}:
    delete:
      x-min-role: admin
      tags: [runners]
      summary: Revoke a runner's key. Its connection and sessions end
      parameters: [ { name: runner, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Revoked } }
  /sessions/{session}/tools/{tool}:
    post:
      tags: [runs]
      summary: A team tool call from a running session (team-tools.md). The actor comes from the session token, never the body
      security: [ { session: [] } ]
      parameters:
        - { name: session, in: path, required: true, schema: { type: string } }
        - { name: tool, in: path, required: true, schema: { enum: [report, handoff, bug, signoff, blocked, ask_owner, request_approval] } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, description: The tool's input, as in team-tools.md } } } }
      responses:
        "200": { description: "The result: event, card or approval ids", content: { application/json: { schema: { $ref: "#/components/schemas/ToolResult" } } } }
        "401": { description: The session token is missing, expired or for another session }
        "403": { description: "This role may not call this tool (ask_owner outside the front door)" }
        "422": { description: The input was refused, content: { application/json: { schema: { type: object, properties: { problems: { type: array, items: { type: string } } } } } } }
  /auth/step-up:
    post:
      x-min-role: viewer
      tags: [me]
      summary: "A single-use step-up token (su_, 5 minutes), bound to the person and the tenant. Only ever minted from a proof that the person is present now: on a hosted deployment a passkey assertion with user verification ({ webauthn }, after GET /auth/step-up/challenge); in local mode the typed step-up secret ({ secret }; the deployment holds only its scrypt hash, AGENT_TEAM_STEP_UP_SECRET_HASH). A hosted deployment refuses { secret } (400, problem type step-up-method). A sign-in, however recent, is never a step-up. Five failures in 15 minutes lock it (429)"
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { webauthn: { type: object, description: "AuthenticationResponseJSON (WebAuthn Level 3)" }, secret: { type: string, writeOnly: true, description: Local mode only } } } } } }
      responses: { "201": { description: The step-up token, content: { application/json: { schema: { type: object, properties: { token: { type: string }, expires: { type: string, format: date-time } } } } } }, "401": { $ref: "#/components/responses/Problem" }, "429": { description: Too many wrong secrets; locked for 15 minutes } }
  /auth/step-up/challenge:
    get:
      tags: [me]
      summary: "Passkey step-up options (PublicKeyCredentialRequestOptionsJSON, userVerification required): the person's passkeys and a challenge for one use within 2 minutes. 409 (problem type no-passkey) when they have none"
      responses: { "200": { description: Options, content: { application/json: { schema: { type: object } } } } }
  /me/passkeys:
    get: { tags: [me], summary: My passkeys, responses: { "200": { description: Passkeys, content: { application/json: { schema: { type: object, properties: { passkeys: { type: array, items: { $ref: "#/components/schemas/Passkey" } } } } } } } } }
    post:
      tags: [me]
      summary: "Add a passkey: { name, credential: RegistrationResponseJSON } for options from GET /me/passkeys/options. The first one needs a sign-in under 5 minutes old (else 401 step-up-required, sign in again); any later one needs step-up. Audited, in every workspace the person is in"
      parameters: [ { $ref: "#/components/parameters/stepUp" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, credential], properties: { name: { type: string, maxLength: 80 }, credential: { type: object } } } } } }
      responses: { "201": { description: The passkey, content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } } }, "400": { description: "Not verified (problem type webauthn-failed): no user verification, another origin or rpId, or a used challenge" }, "401": { description: "Step-up required" } }
  /me/passkeys/options:
    get: { tags: [me], summary: "Registration options (PublicKeyCredentialCreationOptionsJSON, userVerification required, none attestation) with a challenge for one use within 2 minutes", responses: { "200": { description: Options, content: { application/json: { schema: { type: object } } } } } }
  /me/passkeys/{passkey}:
    delete:
      tags: [me]
      summary: Remove a passkey. Needs step-up. Audited
      parameters: [ { name: passkey, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/stepUp" } ]
      responses: { "200": { description: Removed }, "401": { description: Step-up required } }
  /internal/caller:
    get:
      tags: [internal]
      security: [ { cron: [] } ]
      summary: "For the deploy's smoke check, with sign-in on: the caller's IP as the sign-in rate limits see it, and whether the request came through the deployment's edge (it carried AGENT_TEAM_EDGE_SECRET). Never echoes the header. 404 when sign-in or CRON_SECRET is off"
      responses: { "200": { description: Caller, content: { application/json: { schema: { type: object, properties: { ip: { type: string }, edge: { type: boolean } } } } } } }
  /teams/{team}/budget:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get: { x-min-role: viewer, tags: [runs], summary: "The team's caps and today's spend", responses: { "200": { description: Budget, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } } } }
    put:
      x-min-role: admin
      tags: [runs]
      summary: Set the caps. A run needs a daily cap before it starts. Raising or clearing a cap needs step-up; lowering one does not
      parameters: [ { $ref: "#/components/parameters/stepUp" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
      responses: { "200": { description: Budget, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }, "401": { description: "Step-up required (problem type step-up-required)" } }
  /me:
    get:
      tags: [me]
      summary: "Who is signed in: their workspaces and role in each, how many passkeys they have, and when they signed in (auth_time; never a step-up). 401 (problem type unauthenticated) sends the web to /oauth/authorize"
      responses: { "200": { description: Me, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }, "401": { description: "Not signed in (problem type unauthenticated)" } }
  /me/inbox:
    get:
      x-min-role: viewer
      tags: [me]
      summary: Everything waiting for me across teams, as cards, most urgent first (clients.md section 5)
      parameters: [ { $ref: "#/components/parameters/cursor" }, { $ref: "#/components/parameters/limit" } ]
      responses: { "200": { description: Cards, content: { application/json: { schema: { type: object, properties: { asOf: { type: string }, cards: { type: array, items: { $ref: "#/components/schemas/Card" } }, next: { type: string } } } } } } }
  /me/summary:
    get:
      x-min-role: viewer
      tags: [me]
      summary: Each of my teams at a glance (live version, run state, roles by status, cost today, inbox count)
      responses: { "200": { description: Summary, content: { application/json: { schema: { $ref: "#/components/schemas/Summary" } } } } }
  /me/stream:
    get:
      x-min-role: viewer
      tags: [me]
      summary: Live events for every team I can see, and my cards, as server-sent events; resumes from Last-Event-ID
      responses: { "200": { description: text/event-stream of envelopes, content: { text/event-stream: {} } } }
  /me/devices:
    get: { x-min-role: viewer, tags: [me], summary: My registered devices, responses: { "200": { description: Devices, content: { application/json: { schema: { type: object, properties: { devices: { type: array, items: { $ref: "#/components/schemas/Device" } } } } } } } } }
    post:
      x-min-role: viewer
      tags: [me]
      summary: Register this client install (platform, app version, push token, step-up public key)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
      responses: { "201": { description: The device, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } } }
  /me/devices/{device}:
    delete:
      x-min-role: viewer
      tags: [me]
      summary: Remove a device and revoke its tokens
      parameters: [ { name: device, in: path, required: true, schema: { type: string } } ]
      responses: { "204": { description: Removed } }
  /teams/{team}/roles/{role}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: role, in: path, required: true, schema: { type: string } } ]
    get:
      x-min-role: viewer
      tags: [events]
      summary: One role's page (current task, branch, PR, recent reports, evidence, meetings), with asOf
      responses: { "200": { description: Role page } }
  /cards/{card}:
    get: { x-min-role: viewer, tags: [approvals], summary: "One card as it is now (the deep link /t/{team}/cards/{id} opens it)", parameters: [ { name: card, in: path, required: true, schema: { type: string } } ], responses: { "200": { description: The card, content: { application/json: { schema: { $ref: "#/components/schemas/Card" } } } } } }
    post:
      x-min-role: approver
      tags: [approvals]
      summary: "Answer a decision or ongoing-work card. Send the version you saw; a stale version gets 409 with the current card. x-min-role is the least for any card; each kind needs its own: approval and decision cards an approver, a budget card (and any kind not named here) an admin, else 403 forbidden"
      parameters: [ { name: card, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/stepUp" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [option, version], properties: { option: { type: string }, version: { type: integer }, note: { type: string } } } } } }
      responses: { "200": { description: The answer event }, "409": { description: The card changed, content: { application/json: { schema: { $ref: "#/components/schemas/Card" } } } } }
  /members:
    get:
      x-min-role: viewer
      tags: [members]
      summary: "The workspace's members and their roles. Roles, each including the ones before it: viewer, editor, approver, admin, owner (docs/specs/m4-sign-in.md section 4)"
      responses: { "200": { description: Members, content: { application/json: { schema: { type: object, properties: { members: { type: array, items: { $ref: "#/components/schemas/Member" } } } } } } } }
  /members/{member}:
    parameters: [ { name: member, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/stepUp" } ]
    patch:
      x-min-role: admin
      tags: [members]
      summary: "Change a member's role. Needs step-up. Only an owner makes or changes an owner; the last owner cannot be demoted (409, problem type last-owner). Audited"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: "#/components/schemas/Role" } } } } } }
      responses: { "200": { description: The member's role, content: { application/json: { schema: { type: object, properties: { id: { type: string }, role: { $ref: "#/components/schemas/Role" } } } } } }, "401": { description: Step-up required }, "403": { $ref: "#/components/responses/Problem" }, "404": { description: No such member }, "409": { description: The last owner } }
    delete:
      x-min-role: admin
      tags: [members]
      summary: "Remove a member. Needs step-up. Their access to this workspace ends on their next request; a person left in no workspace is signed out everywhere, app tokens included. Only an owner removes an owner; never the last one (409). Audited"
      responses: { "200": { description: Removed }, "401": { description: Step-up required }, "403": { $ref: "#/components/responses/Problem" }, "404": { description: No such member }, "409": { description: The last owner } }
  /invitations:
    get:
      x-min-role: admin
      tags: [members]
      summary: Open invitations
      responses: { "200": { description: Invitations, content: { application/json: { schema: { type: object, properties: { invitations: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } } } } }
    post:
      x-min-role: admin
      tags: [members]
      summary: "Invite someone by GitHub login or numeric user id. The server resolves a login to its numeric id once, here, and the invitation holds the id (a login can change hands). Needs step-up; only an owner invites an owner. A newer invitation for the same person replaces an open one. 404 (no-such-github-user), 409 (already-member)"
      parameters: [ { $ref: "#/components/parameters/stepUp" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [github, role], properties: { github: { type: string, description: "A login (octocat) or numeric id" }, role: { $ref: "#/components/schemas/Role" }, days: { type: integer, minimum: 1, maximum: 30, default: 7 } } } } } }
      responses: { "201": { description: The invitation, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }, "401": { description: Step-up required }, "403": { $ref: "#/components/responses/Problem" }, "404": { description: GitHub has no such user }, "409": { description: Already a member } }
  /invitations/{invitation}:
    delete:
      x-min-role: admin
      tags: [members]
      summary: Withdraw an open invitation. Audited
      parameters: [ { name: invitation, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Withdrawn }, "404": { description: No such open invitation } }
components:
  securitySchemes:
    person: { type: http, scheme: bearer, description: OIDC sign-in; a cookie in the browser }
    session: { type: http, scheme: bearer, description: Short-lived agent session token from the runner }
    runner: { type: http, scheme: bearer, description: Runner key }
    reportToken: { type: apiKey, in: header, name: x-team-token }
    cron: { type: http, scheme: bearer, description: "The deployment's CRON_SECRET, for /internal/* only (its tick and its smoke check); never a person's" }
    cookie: { type: apiKey, in: cookie, name: __Host-agent-team, description: "The web's session, set by the issuer's callback (HttpOnly, Secure, SameSite=Lax; 12 hours idle, 7 days in all). An unsafe method sent with it needs this deployment's Origin and content-type application/json, or gets 403 (problem type csrf)" }
  parameters:
    team: { name: team, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" } }
    cursor: { name: cursor, in: query, schema: { type: string } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
    stepUp: { name: x-step-up, in: header, schema: { type: string }, description: "A step-up token from POST /auth/step-up: approvals, options with stepUp: true, raising a budget cap, resuming after a budget pause, runner codes and secrets" }
  responses:
    Problem: { description: An error (RFC 9457), content: { application/problem+json: { schema: { type: object, properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string } } } } } }
    Team: { description: A team, content: { application/json: { schema: { $ref: "#/components/schemas/Team" } } } }
    TeamList: { description: Teams, content: { application/json: { schema: { type: object, properties: { teams: { type: array, items: { $ref: "#/components/schemas/Team" } }, next: { type: string } } } } } }
  schemas:
    Role: { type: string, enum: [viewer, editor, approver, admin, owner], description: "Each includes the ones before it. Every operation states its minimum as x-min-role" }
    Member:
      type: object
      properties: { id: { type: string, description: "mem_…" }, person: { type: string, description: "per_…" }, login: { type: string }, name: { type: string }, role: { $ref: "#/components/schemas/Role" }, since: { type: string, format: date-time } }
    Invitation:
      type: object
      properties: { id: { type: string, description: "inv_…" }, github: { type: string, description: The numeric GitHub user id }, login: { type: [string, "null"] }, email: { type: [string, "null"] }, role: { $ref: "#/components/schemas/Role" }, invitedBy: { type: string }, createdAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time } }
    Passkey:
      type: object
      properties: { id: { type: string, description: "pk_…" }, name: { type: string }, createdAt: { type: string, format: date-time }, lastUsed: { type: [string, "null"], format: date-time } }
    Me:
      type: object
      required: [id, workspaces, passkeys]
      properties:
        id: { type: string, description: "per_…" }
        login: { type: [string, "null"], description: The upstream login, for display only (it can change) }
        name: { type: [string, "null"] }
        workspaces: { type: array, items: { type: object, properties: { tenant: { type: string }, role: { type: string, enum: [owner, admin, editor, viewer, approver] } } } }
        passkeys: { type: integer }
        authTime: { type: [string, "null"], format: date-time }
        notices: { type: array, description: "The person's own security changes of the last 30 days, newest first (at most 20): passkey.added, passkey.removed, passkey.sign-count-flagged, step-up.locked, sessions.ended, member.role-changed, member.removed. Shown until the notifications channel delivers them (S5)", items: { type: object, properties: { action: { type: string }, at: { type: string, format: date-time }, passkey: { type: string }, name: { type: string }, tenant: { type: string }, role: { type: string } } } }
    Team:
      type: object
      properties:
        id: { type: string }
        workspace: { type: string }
        name: { type: string }
        store: { type: object, description: "The workspace store: a repository resource and branch" }
        version: { type: string, description: The live published version (commit SHA) }
        spec: { $ref: "../../packages/team-model/schema/team-spec.v1.json" }
    TeamCreate:
      type: object
      required: [name]
      properties: { name: { type: string }, workspace: { type: string }, repository: { type: string, description: A repository resource, or omitted for a Studio-managed one }, template: { type: string } }
    SpecBody: { type: object, required: [spec], properties: { spec: { $ref: "../../packages/team-model/schema/team-spec.v1.json" } } }
    Preview:
      type: object
      properties:
        changes: { type: array, items: { type: object, properties: { path: { type: string }, status: { enum: [added, changed, removed] }, before: { type: [string, "null"] }, after: { type: [string, "null"] } } } }
        issues: { type: array, items: { type: object, properties: { level: { enum: [error, warning] }, where: { type: string }, message: { type: string } } } }
    Publish:
      allOf:
        - $ref: "#/components/schemas/SpecBody"
        - type: object
          properties: { mode: { enum: [pull-request, commit], default: pull-request }, branch: { type: string }, message: { type: string } }
    PublishResult: { type: object, properties: { branch: { type: string }, commit: { type: string }, pr: { type: integer }, url: { type: string } } }
    KitReport:
      type: object
      description: Exactly the report team-status.sh and report.mjs send (tools/board.mjs toRow).
      required: [role]
      properties:
        id: { type: string }
        at: { type: string }
        role: { type: string }
        instance: { type: string }
        kind: { enum: [status, handoff, bug, signoff, blocked, note, heartbeat] }
        status: { enum: [idle, working, waiting, blocked, review, done] }
        task: { type: string }
        issue: { type: integer }
        pr: { type: integer }
        branch: { type: string }
        commit: { type: string }
        platform: { type: string }
        to: { type: string }
        to_role: { type: string }
        severity: { type: integer }
        evidence: { oneOf: [ { type: array, items: { type: string } }, { type: string } ] }
        detail: { type: string }
        source: { type: string }
        session: { type: string }
      additionalProperties: true
    Board:
      type: object
      properties:
        at: { type: string, format: date-time }
        roles:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              instance: { type: [string, "null"] }
              status: { type: string }
              task: { type: [string, "null"] }
              issue: { type: [integer, "null"] }
              pr: { type: [integer, "null"] }
              branch: { type: [string, "null"] }
              statusAt: { type: string, format: date-time }
              lastAt: { type: string, format: date-time }
              stale: { type: boolean }
              waitingOn: { type: [string, "null"] }
              live: { type: boolean, description: A hook or the runner reported in the last few minutes }
    RunCreate:
      type: object
      properties:
        mode: { enum: [runner, subagents, agent-teams], default: runner }
        caps: { type: object, properties: { costPerRun: { type: integer }, costPerDay: { type: integer }, currency: { type: string }, sessions: { type: integer } } }
        team:
          type: object
          description: "The team version the run is frozen on. Sent by a person (the Studio fills it from the spec it compiles), never by a runner or session. Exactly one role reports to owner: the front door. Required until the server reads published versions itself"
          required: [roles]
          properties:
            version: { type: string, description: The team version (commit SHA); it becomes the run's teamVersion }
            repo:
              type: object
              description: "The repository sessions work in. No credentials in the URL (400): the run reaches it through a connector"
              required: [url]
              properties:
                url: { type: string, description: "An https://, ssh:// or git@host:path URL; or a path or file:// URL for a runner on the same machine (local mode)" }
                ref: { type: string, default: main, description: The branch worktrees start from }
            summary: { type: string, maxLength: 2000, description: What the team is for, from the team file }
            roles:
              type: array
              items:
                type: object
                required: [slug, reportsTo]
                properties:
                  slug: { type: string }
                  reportsTo: { type: string, description: A role slug, or owner }
                  areas: { type: array, items: { type: string }, description: Owned paths, sent to the runner in session.start }
                  pool: { type: integer, description: "Most instances, so to: role#instance can be checked" }
                  model: { type: string }
                  brief: { type: string, description: "The role's brief as text, at most 20 KB; sent to the runner as session.start prompt.brief" }
    Card:
      type: object
      description: Anything a person answers, the same on every client and channel (clients.md section 6)
      required: [id, kind, title, options, version, url]
      properties:
        id: { type: string }
        kind: { type: string, description: "approval, decision, budget, ongoing-work, meeting-invite, channel-failed; clients render unknown kinds generically" }
        team: { type: string }
        subject: { type: string }
        title: { type: string }
        body: { type: string, description: Markdown subset, no HTML }
        recommendation: { type: object, properties: { option: { type: string }, why: { type: string } } }
        options: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, style: { type: string }, stepUp: { type: boolean } } } }
        risk: { type: string }
        expires: { type: string, format: date-time }
        version: { type: integer }
        links: { type: array, items: { type: object, properties: { rel: { type: string }, url: { type: string } } } }
        url: { type: string, description: The deep link (clients.md section 8) }
    Summary:
      type: object
      properties:
        asOf: { type: string }
        teams:
          type: array
          items:
            type: object
            properties:
              team: { type: string }
              name: { type: string }
              version: { type: string }
              run: { type: [string, "null"], description: "running, paused, stopped, or null" }
              roles: { type: object, properties: { working: { type: integer }, waiting: { type: integer }, blocked: { type: integer }, idle: { type: integer } } }
              cost: { type: object, properties: { today: { type: integer }, capPerDay: { type: [integer, "null"] }, currency: { type: string } } }
              inbox: { type: integer }
    ChatPage:
      type: object
      properties:
        asOf: { type: string, description: The last event id included; open the stream from it }
        items: { type: array, items: { $ref: "schema/event.v1.json" }, description: Oldest first }
        cards: { type: object, additionalProperties: { $ref: "#/components/schemas/Card" }, description: The current card for every card the items mention }
        run: { type: [object, "null"], properties: { id: { type: string }, state: { type: string }, version: { type: integer } } }
        cost: { type: object, properties: { today: { type: integer }, capPerDay: { type: [integer, "null"] }, currency: { type: string }, state: { type: string, description: "ok, warned, exhausted" } } }
        next: { type: string }
    Budget:
      type: object
      properties:
        perDay: { type: [integer, "null"], description: Minor units }
        perRun: { type: [integer, "null"] }
        sessions: { type: integer, default: 3, description: Live sessions at once }
        currency: { type: string }
        today: { type: object, readOnly: true, properties: { day: { type: string, format: date }, spent: { type: integer }, raised: { type: integer }, state: { type: string } } }
    ToolResult:
      type: object
      properties: { event: { type: string }, card: { type: string }, approval: { type: string } }
    Device:
      type: object
      properties:
        id: { type: string, readOnly: true }
        platform: { enum: [ios, android, web, desktop] }
        appVersion: { type: string }
        name: { type: string }
        push: { type: object, properties: { provider: { type: string, description: "apns, fcm, webpush" }, token: { type: string, writeOnly: true } } }
        stepUpKey: { type: string, description: Public key (JWK) for step-up signatures; the private key never leaves the device }
        lastSeen: { type: string, format: date-time, readOnly: true }
