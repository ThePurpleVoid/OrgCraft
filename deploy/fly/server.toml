# Fly.io config for the control plane container. The app name, region and environment come from the deploy workflow:
#   flyctl deploy . --config deploy/fly/server.toml --dockerfile deploy/server/Dockerfile --app <FLY_APP> --ha=false
# One machine, always on: live streams, the runner socket, the sink worker and timers live in this process, and a
# second instance would need cross-instance fan-out first (apps/server README, "Not yet").

[deploy]
  # Runs in a one-off machine with the new image before any traffic moves; a refusal stops the deploy.
  release_command = "node deploy/server/migrate.mjs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
