<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="agent-team-mode" content="hosted">
  <meta name="referrer" content="no-referrer">
  <title>Your account · OrgCraft Studio</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="ats auth-page">
  <main class="auth-card wide" aria-labelledby="account-title">
    <p class="auth-brand row"><strong>OrgCraft Studio</strong> <a href="/" class="muted">Back to the team</a></p>
    <h1 id="account-title">Your account</h1>
    <div id="account"><p class="muted">Loading…</p></div>
  </main>
  <dialog id="passkey-add" class="auth-dialog" aria-labelledby="passkey-add-title">
    <form class="dialog" id="passkey-add-form">
      <h2 id="passkey-add-title">Add a passkey</h2>
      <p id="passkey-add-intro"></p>
      <label><span id="passkey-name-label">Name</span> <input id="passkey-name" maxlength="60" autocomplete="off" aria-describedby="passkey-name-hint"></label>
      <p class="hint" id="passkey-name-hint"></p>
      <p class="result error" role="alert" id="passkey-add-result"></p>
      <div class="dialog-actions"><button type="button" id="passkey-add-cancel">Not now</button><button type="submit" class="primary" id="passkey-add-create">Create passkey</button></div>
    </form>
  </dialog>
  <script type="module" src="/account.js"></script>
</body>
</html>
