openapi: 3.1.0
info:
  title: OrgCraft Studio API
  version: "1"
  summary: The public API. The Studio, the CLI, the kit's hooks and integrations use only this.
  description: |
    Versioned in the path. Within /v1/, changes are additive only, and a removal comes with at least 12 months'
    notice (docs/contracts/README.md). Every response that lists things pages with `cursor` and `limit`.
    Every write accepts an `Idempotency-Key` header (1 to 255 characters, scoped to the caller). The first answer,
    errors included, is kept for 24 hours; a retry with the same key and the same method, path and body gets it back
    with `Idempotent-Replayed: true`. The same key on a different request is `422`; while the first request is still
    running, a retry gets `409`. Server errors (5xx) are not kept, so a retry runs again.

    Authentication:
    - People sign in through OIDC (GitHub first) and send a session cookie or a bearer token.
    - Agent sessions use a short-lived session token from the runner.
    - Teams that report from outside the product (the kit's scripts and hooks) use a per-team **report token**
      in `x-team-token`. It can append reports for that one team and read nothing.
servers:
  - url: https://{host}/v1
    variables: { host: { default: localhost:4849 } }
security:
  - person: []
  - cookie: []
  - app: []
tags:
  - { name: teams }
  - { name: events, description: "The event log (events.md) and the board projected from it" }
  - { name: studio, description: "The deployment's own Studio page (hosted mode, docs/specs/studio-embed.md): the kit's Studio handler under each team" }
  - { name: runs }
  - { name: chat }
  - { name: approvals }
  - { name: connectors }
  - { name: notifications, description: "Email or Slack a person when something needs them (PRD 6.8): their own verified addresses or linked Slack account, the kinds they chose, channels an admin picked, signed links. Nothing is ever approved or answered from an email or Slack" }
  - { name: runners, description: Registration. The runner protocol itself is runner-protocol.md }
  - { name: me, description: "The signed-in person across teams: inbox, summary, devices (clients.md)" }
paths:
  /teams:
    get: { x-min-role: viewer, tags: [teams], summary: Teams in the workspaces I can see, responses: { "200": { $ref: "#/components/responses/TeamList" } } }
    post:
      x-min-role: admin
      tags: [teams]
      summary: Connect a team (a repository with .agent-team/, or a new Studio-managed team repository)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TeamCreate" } } } }
      responses: { "201": { $ref: "#/components/responses/Team" } }
  /teams/{team}:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [teams]
      summary: The team, its live version (commit SHA), and its spec at that version as a TeamSpec
      responses: { "200": { $ref: "#/components/responses/Team" } }
    put:
      x-min-role: admin
      tags: [teams]
      summary: "Control plane: change the team's name or its GitHub repository (repo, owner/name, or null). The hosted Studio edits that repository only while its owner is an account the workspace proved (/github/installations). GET answers repo too"
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string, maxLength: 100 }, repo: { type: [string, "null"], pattern: "^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$" } } } } } }
      responses: { "200": { description: "{ id, name, created_at, repo }" } }
  /teams/{team}/preview:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: editor
      tags: [teams]
      summary: Every file a publish of this spec would change, and the validate issues
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SpecBody" } } } }
      responses: { "200": { description: Changes and issues, content: { application/json: { schema: { $ref: "#/components/schemas/Preview" } } } } }
  /teams/{team}/publish:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: admin
      tags: [teams]
      summary: Compile, sync with the pinned kit, and propose (a pull request) or commit
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Publish" } } } }
      responses:
        "202": { description: Publish started; follow `team.published` events, content: { application/json: { schema: { $ref: "#/components/schemas/PublishResult" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /teams/{team}/reports:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      tags: [events]
      summary: Accept one report in the kit's shape (team-status.sh, report.mjs, the hooks), byte for byte
      description: Mapped to a `report.*` or `message.*` event (events.md). This is what TEAM_REPORT_URL points at. A body with `kind` `published` (report.mjs published, from the team's CI on main) is a `team.published` event with id `published-<version>`, stored once per commit; `duplicate` is true when it was already there.
      security: [ { reportToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { oneOf: [ { $ref: "#/components/schemas/KitReport" }, { $ref: "#/components/schemas/KitPublished" } ] } } } }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { type: object, properties: { ok: { const: true }, id: { type: string }, duplicate: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { description: More than 30 reports a minute from one role }
  /teams/{team}/events:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [events]
      summary: The event log, newest last, filtered by type prefix, actor and time
      parameters:
        - { name: type, in: query, schema: { type: string }, description: "Prefix, such as report. or approval." }
        - { name: actor, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses: { "200": { description: Events, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "schema/event.v1.json" } }, next: { type: string } } } } } } }
    post:
      x-min-role: admin
      tags: [events]
      summary: "Append envelopes from an integration. Ids make retries safe. Only report.*, message.*, usage.recorded and team.published are taken (issue #135); any other type in the batch refuses the whole batch with 403 (refused lists them), because the control plane and runners write the rest themselves"
      security: [ { session: [] }, { runner: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "schema/event.v1.json" }, maxItems: 500 } } } } } }
      responses: { "200": { description: Stored (duplicates ignored) } }
  /teams/{team}/events/stream:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [events]
      summary: "Live events as server-sent events; resumes from Last-Event-ID. With ?ticket= (a stream ticket) it needs no other credential, answers CORS for the minting host's origins only (never with credentials), and ends when the person leaves the workspace or the host is revoked"
      parameters: [ { name: ticket, in: query, required: false, schema: { type: string }, description: "a stream ticket (single use, 60 seconds); keep it out of access logs" } ]
      responses: { "200": { description: text/event-stream of envelopes, content: { text/event-stream: {} } } }
  /teams/{team}/stream-tickets:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: viewer
      tags: [events]
      summary: "A stream ticket (S8): single use, 60 seconds, read-only, for this team and the caller. A host's page opens the stream with it directly, because server-sent events cannot pass through a short-lived function. Needs sign-in on"
      responses: { "201": { description: "{ ticket, url, expiresIn }" } }
  /teams/{team}/board:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [events]
      summary: Where every role stands now (the board projection)
      responses: { "200": { description: Board, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } } }
  /teams/{team}/studio/v1/team:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [studio]
      summary: "The Studio (hosted mode): the team as the Studio reads it from the team's GitHub repository, with base (the default branch's head sha), git, features, and (kit 0.22, additive) members[] and catalog[] computed from the spec exactly as the local Studio returns them (plans team-json-0.22 section 4: each teammate with id, name, type, lane, pool, handsTo, problems; each role type with count of enabled teammates). 503 until the deployment's GitHub App is set up; 409 no-repo when the team has no repository connected"
      responses: { "200": { description: OK } }
  /teams/{team}/studio/v1/team/pr:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get:
      x-min-role: viewer
      tags: [studio]
      summary: "The Studio: a pull request's state for ?branch= (agent-team/ branches only)"
      responses: { "200": { description: OK } }
  /teams/{team}/studio/v1/team/preview:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: viewer
      tags: [studio]
      summary: "The Studio: what Publish would change, { spec, base } → changes, issues, commands, needsCode, kitUpgrade. Writes nothing"
      responses: { "200": { description: OK } }
  /teams/{team}/studio/v1/team/graph:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: viewer
      tags: [studio]
      summary: "The Studio: the team's graph for a spec. Writes nothing"
      responses: { "200": { description: OK } }
  /teams/{team}/studio/v1/team/suggestions:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: viewer
      tags: [studio]
      summary: "The Studio: suggested areas and checks from the repository at base. Writes nothing"
      responses: { "200": { description: OK } }
  /teams/{team}/studio/v1/team/from-template:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: viewer
      tags: [studio]
      summary: "The Studio: a team spec from a template. Writes nothing"
      responses: { "200": { description: OK } }
  /teams/{team}/studio/v1/team/publish:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: editor
      tags: [studio]
      summary: "The Studio: Publish, { spec, base, message, branch? } → a new agent-team/ branch and a pull request, with the deployment's GitHub App on an installation this workspace has connected. A change to commands the team runs needs admin. 409 stale when the default branch moved, 409 exists for a branch name in use. Send Idempotency-Key so a retry opens one pull request"
      responses: { "200": { description: OK } }
  /teams/{team}/studio/assets/{version}/{name}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: version, in: path, required: true, schema: { type: string } }, { name: name, in: path, required: true, schema: { type: string } } ]
    get:
      x-min-role: viewer
      tags: [studio]
      summary: "The Studio's page assets for this kit version (immutable)"
      responses: { "200": { description: OK } }
  /teams/{team}/rollout:
    parameters:
      - { $ref: "#/components/parameters/team" }
      - { name: version, in: query, schema: { type: string, pattern: "^[0-9a-f]{7,40}$" }, description: "A published commit; default: the latest team.published event's" }
      - { name: publishedAt, in: query, schema: { type: string, format: date-time }, description: "When it merged (with version)" }
    get:
      x-min-role: viewer
      tags: [events]
      summary: "The rollout after a publish merges (demo step 17): per role moved, next-task, finishing (with the change step's plan), off-finishing, off, no-report or unknown, and the summary. A role counts as moved only when a report after the merge names the new version. Read-only"
      responses: { "200": { description: "{ version, name, publishedAt, pr, roles: [{ role, state, teamVersion, status, task, lastAt, stale, plan? }], summary: { moved, of, finishing, offFinishing, unknown, noReport, allMoved } }; version null when nothing is published yet" } }
  /teams/{team}/changes:
    parameters:
      - { $ref: "#/components/parameters/team" }
      - { name: state, in: query, schema: { type: string, enum: [open, accepted, closed] } }
    get:
      x-min-role: viewer
      tags: [studio]
      summary: "A managed team's change requests (ADR 0012, spec L9 section 4.5), newest first, at most 200. 409 not-managed for a team in a code host"
      responses: { "200": { description: "{ changes: [{ number, title, state, base, head, branch, url, checks, capability, needsCode, createdBy, authorMember, acceptedBy, acceptedSha, createdAt, closedAt }] }" } }
  /teams/{team}/changes/{change}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: change, in: path, required: true, schema: { type: integer, minimum: 1 } } ]
    get:
      x-min-role: viewer
      tags: [studio]
      summary: "One change request: its title and body, the files it changes (before and after), the capability diff (Widens access, ADR 0013), the checks, and the commands it adds when it changes what the team runs"
      responses: { "200": { description: "{ number, title, body, state, base, head, branch, url, checks: { ok, errors, drift }, capability: [{ kind, subject, subjects?, detail }], needsCode, files: [{ path, status, before, after }], commands }" } }
  /teams/{team}/changes/{change}/accept:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: change, in: path, required: true, schema: { type: integer, minimum: 1 } } ]
    post:
      x-min-role: admin
      x-interactive-only: true
      tags: [studio]
      summary: "Accept a change: the checks and the capability diff run again at its head against the current main. Red checks refuse (409 checks); a change a teammate drafted that widens itself or weakens a check refuses (403 self-widening); commands need an admin (403 publish-code); a non-empty capability diff needs x-step-up from a step-up scoped to this change (scope accept-change:<team>_<number>, named in the 401) and is audited with the person's words. Then main moves, fast-forward only (409 stale), and team.published (id published-<sha>, via managed) is appended once"
      requestBody: { content: { application/json: { schema: { type: object, properties: { words: { type: string, maxLength: 2000, description: "What the person says about it, kept in the audit row" } } } } } }
      responses: { "200": { description: "The change, accepted, with the files it changed" }, "401": { description: "step-up-required, with body.scope accept-change:<team>_<number>" }, "403": { description: "self-widening, publish-code" }, "409": { description: "stale, checks, or the change is not open" } }
  /teams/{team}/changes/{change}/close:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: change, in: path, required: true, schema: { type: integer, minimum: 1 } } ]
    post: { x-min-role: editor, tags: [studio], summary: "Close an open change without accepting it; its ref cr/<n> stays for history", responses: { "200": { description: The change, closed } } }
  /teams/{team}/rollback:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: admin
      x-interactive-only: true
      tags: [studio]
      summary: "Roll a managed team back (spec L9 section 4.5, S2-19): opens a change request whose tree is version `to`'s, on top of main. Its capability diff is against the current main, so access it restores needs the step-up when it is accepted"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [to], properties: { to: { type: string, pattern: "^[0-9a-f]{40}$" } } } } } }
      responses: { "201": { description: "The new change request, as GET /teams/{team}/changes/{change}" }, "404": { description: "Not a version this team published" } }
  /teams/{team}/tasks:
    parameters:
      - { $ref: "#/components/parameters/team" }
      - { name: state, in: query, schema: { type: string, enum: [needs-you, failed, out-of-budget, stopped, blocked, running, done] }, description: "needs-you is 'Waiting for you'" }
      - { name: role, in: query, schema: { type: string } }
      - { name: trigger, in: query, schema: { type: string }, description: "Tasks a trigger started" }
      - { name: since, in: query, schema: { type: string, format: date-time }, description: "Last active at or after" }
      - { name: until, in: query, schema: { type: string, format: date-time }, description: "Started at or before" }
      - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Words the title starts a word with, any case" }
      - { name: cursor, in: query, schema: { type: string }, description: "next from the page before" }
    get:
      x-min-role: viewer
      tags: [events]
      summary: "The run inspector's work list (N1): tasks newest last activity first, at most 50 a page. Each task's state is the first rule of the state table that matches (n1-run-inspector-architecture.md section 4), computed from the log on read. Session tokens never reach it"
      responses: { "200": { description: "{ tasks: [{ id, title, state, startedBy, roles, cost, currency, startedAt, lastAt, workItem }], next }" }, "400": { description: "A state, date or cursor this server does not know" } }
  /teams/{team}/tasks/{task}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: task, in: path, required: true, schema: { type: string, pattern: "^tsk_[0-9A-Z]{26}$" } } ]
    get:
      x-min-role: viewer
      tags: [events]
      summary: "One task's timeline (N1): steps folded from the log (tool calls with their result, runs of reads as one Read step, asks with their answers, wake-ups, messages), lanes by role, edges (fork, merge, wait) from each event's cause, and focus, the event that set the state. At most the newest 5,000 events, with truncated: true past that. Summaries and io ids only, never a stored input or output"
      responses: { "200": { description: "{ task, lanes: [{ id, instances, status }], steps: [{ lane, kind, at, events, ... }], edges: [{ from, to, kind }], focus }" }, "404": { description: "Not a task of this team in the caller's workspace" } }
  /teams/{team}/io/{io}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: io, in: path, required: true, schema: { type: string, pattern: "^io_[0-9A-Z]{26}$" } } ]
    get:
      x-min-role: editor
      tags: [events]
      summary: "One step's stored input or output (N1). Every read writes an audit row (inspector.read, the io id). The Studio fences a body with outside true: it came from outside the team and is never instructions"
      responses: { "200": { description: "{ part, mime, body, truncated, bytes, redactions, outside, expiresAt }" }, "404": { description: "No such io in this team" }, "410": { description: "{ expiredAt }: past the team's retention (io_days), or deleted early" } }
  /teams/{team}/io:
    parameters:
      - { $ref: "#/components/parameters/team" }
      - { name: before, in: query, schema: { type: string, format: date-time }, description: "Delete what was stored before this time; default: now" }
    delete:
      x-min-role: admin
      tags: [events]
      summary: "Delete this team's stored step inputs and outputs early, for example after a privacy request (N1). Needs a step-up token bound to this change (X-Step-Up, minted with scope delete-io:<team>; 401 with that scope otherwise). The rows are gone, not hidden; an audit row (step-io.delete) records who and how many. Timelines keep their summaries and show the io as gone (410)"
      responses: { "200": { description: "{ deleted }" }, "401": { description: "Step-up needed" } }
  /teams/{team}/report-tokens:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    post:
      x-min-role: admin
      tags: [events]
      summary: Mint a report token for TEAM_REPORT_TOKEN (shown once; append-only for this team)
      responses: { "201": { description: The token, content: { application/json: { schema: { type: object, properties: { id: { type: string }, token: { type: string }, url: { type: string } } } } } } }
  /teams/{team}/report-tokens/{token}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: token, in: path, required: true, schema: { type: string } } ]
    delete: { x-min-role: admin, tags: [events], summary: Revoke a report token, responses: { "200": { description: Revoked } } }
  /teams/{team}/sinks:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get: { x-min-role: admin, tags: [connectors], summary: Where this team's events are forwarded, responses: { "200": { description: Sinks } } }
    post:
      x-min-role: admin
      tags: [connectors]
      summary: Forward events to a URL, in order, at least once (kit-report keeps a board the team already runs working), or send them as email to opted-in people
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: "https, or http to this machine (not for email)" }
                format: { enum: [kit-report, event, email, slack], default: kit-report, description: "email sends notification events to the people who opted in (PRD 6.8); slack connects the team's Slack workspace, one per team" }
                provider: { type: string, description: "email only: the provider id, such as resend" }
                sender: { type: string, description: "email only: the From address" }
                header: { type: string, description: "Header to send the secret in, such as x-team-token" }
                secret: { type: string, description: "Name of a stored secret (PUT /secrets/{name}); EMAIL_… for email, SLACK_… (the bot token) for slack" }
                clientId: { type: string, description: "slack only: the Slack app's client id, for Connect Slack" }
                clientSecret: { type: string, description: "slack only: name of the stored secret with the app's client secret (SLACK_…)" }
                from: { enum: [now, start], default: now }
      responses: { "201": { description: The sink } }
  /teams/{team}/sinks/{sink}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: sink, in: path, required: true, schema: { type: string } } ]
    delete: { x-min-role: admin, tags: [connectors], summary: Stop forwarding, responses: { "200": { description: Removed } } }
  /teams/{team}/emails:
    parameters: [ { $ref: "#/components/parameters/team" } ]
    get: { x-min-role: viewer, tags: [notifications], summary: "The caller's own email addresses for this team, and the kinds they can switch on", responses: { "200": { description: "{ teamName, ready, kinds, emails }: ready is false until the team has an email sink with its provider key stored, so the page can say emails are not set up instead of offering a code" } } }
    post:
      x-min-role: viewer
      tags: [notifications]
      summary: Add an address for yourself; a 6-digit code is emailed to it (expires in 15 minutes). Nothing else is sent until it is verified and kinds are on
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
      responses: { "201": { description: "{ id, email, verified, sent, reason? }" }, "429": { description: A code was sent less than a minute ago } }
  /teams/{team}/emails/{email}:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: email, in: path, required: true, schema: { type: string } } ]
    patch:
      x-min-role: viewer
      tags: [notifications]
      summary: Choose the kinds to email (approval, budget80, budget100, blocked, minutes, ready, digest); the address must be verified. digest is the daily digest, sent at the time in /me/notifications
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kinds], properties: { kinds: { type: array, items: { enum: [approval, budget80, budget100, blocked, minutes, ready, digest] } } } } } } }
      responses: { "200": { description: The address }, "409": { description: Not verified yet } }
    delete: { x-min-role: viewer, tags: [notifications], summary: Remove the address, responses: { "200": { description: Removed } } }
  /teams/{team}/emails/{email}/verify:
    parameters: [ { $ref: "#/components/parameters/team" }, { name: email, in: path, required: true, schema: { type: string } } ]
    post:
      x-min-role: viewer
      tags: [notifications]
      summary: Verify the address with the emailed code (5 tries)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: "^[0-9]{6}$" } } } } } }
      responses: { "200": { description: Verified }, "400": { description: Wrong code }, "410": { description: Expired or out of tries } }
  /email/{action}:
    parameters: [ { name: action, in: path, required: true, schema: { enum: [link, unsubscribe, resubscribe] } }, { name: t, in: query, required: true, schema: { type: string } } ]
