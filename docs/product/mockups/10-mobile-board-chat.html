<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phone: board and chat</title><link rel="stylesheet" href="mock.css"><link rel="stylesheet" href="phone.css">
<style>
.android .screen { background: #f7f8fc; }
.appbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px 6px; }
.appbar .title { font-size: 20px; font-weight: 500; flex: 1; }
.appbar .ib { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); }
.filters { display: flex; gap: 8px; padding: 4px 16px 10px; overflow: hidden; }
.filters span { border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; font-size: 13px; white-space: nowrap; background: var(--panel); }
.filters span.on { background: #d8e0ff; border-color: #d8e0ff; font-weight: 500; }
.runbar { margin: 0 16px 10px; background: var(--panel); border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.runbar .meter { flex: 1; height: 6px; background: var(--off); border-radius: 3px; overflow: hidden; }
.runbar .meter i { display: block; height: 100%; width: 37%; background: var(--accent); }
.lane { font-size: 13px; font-weight: 500; color: var(--muted); margin: 10px 18px 4px; display: flex; align-items: center; gap: 6px; }
.rcard { margin: 0 14px 6px; background: var(--panel); border-radius: 16px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; }
.rcard .who { font-weight: 500; font-size: 14.5px; }
.rcard .task { font-size: 13px; color: var(--muted); }
.rcard .when { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.rcard .sdot { margin-top: 6px; }
.ev { margin: 0 14px; }
.shotrow { display: flex; gap: 8px; margin: 8px 0; }
.thumb { flex: 1; height: 120px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
.thumb .top { height: 16px; background: var(--off); }
.thumb.dark { background: #1f2430; } .thumb.dark .top { background: #2a3040; }
.thumb .ln { height: 7px; margin: 7px 10px 0; border-radius: 3px; background: #dfe3ea; }
.thumb.dark .ln { background: #3a4152; }
.thumb .tg { width: 30px; height: 15px; border-radius: 8px; background: var(--accent); margin: 10px 10px 0 auto; }
.tl { font-size: 13px; }
.tl div { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.tl time { color: var(--muted); width: 38px; flex: none; }
.msg { max-width: 82%; border-radius: 18px; padding: 9px 13px; font-size: 14px; margin: 6px 0; }
.msg.me { margin-left: auto; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
.msg.cos { background: var(--panel); border-bottom-left-radius: 6px; }
.msg .from { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.msg.card { max-width: 92%; border: 1px solid var(--line); }
.msg.card .btns { display: flex; gap: 8px; margin-top: 8px; }
.msg.card .btns .btn { flex: 1; padding: 8px; font-size: 14px; }
.compose { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px 16px; background: #eef1f8; }
.compose .in { flex: 1; background: var(--panel); border-radius: 24px; padding: 11px 16px; font-size: 14px; color: var(--muted); }
.compose .mic { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); }
.queued { font-size: 12px; color: var(--muted); text-align: right; margin-top: -2px; }
.offline { margin: 0 14px 6px; background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 7px 12px; font-size: 12.5px; }
</style></head><body>
<header class="sheet-title"><h1>On the phone: the board, a role, and the chief of staff</h1><p>Android app (PRD 6.10, MB4, MB5, MB7, MB10). The board is a list, not the canvas: who is working, who is waiting on whom, and the evidence. Data is invented for a sample app.</p></header>
