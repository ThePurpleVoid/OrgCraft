# Fly.io config for the runner, a second app in the same Fly organization and region as the control plane.
# No public service: the runner only connects out, to the control plane's public URL (https://<FLY_APP>.fly.dev).
#   Deployed by .github/workflows/deploy.yml (job runner) when AGENT_TEAM_RUNNER=on; by hand:
#   flyctl volumes create runner_data --app <FLY_APP>-runner --region iad --size 20
#   flyctl deploy . --config deploy/fly/runner.toml --dockerfile apps/runner/Dockerfile --app <FLY_APP>-runner --ha=false

[mounts]
  source = "runner_data"
  destination = "/data"

[[vm]]
  # Each session is a Claude Code process (a few hundred MB) plus git; 4 GB holds three or four at once.
  size = "shared-cpu-2x"
  memory = "4gb"
